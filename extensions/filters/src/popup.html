<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agex Site Filters</title>
<style>
    body { margin: 0; width: 300px; font: 13px/1.4 system-ui, sans-serif; color: #e6e6f0; background: #1a1a2e; }
    main { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    p { margin: 0; }
    .muted { color: #9a9ab0; font-size: 12px; }
    .warn { color: #d9a441; font-size: 12px; }
    button { padding: 7px 10px; border: 0; border-radius: 6px; background: #e94560; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    a { color: #9a9ab0; font-size: 12px; }
</style>
</head>
<body>
<main>
    <h1 id="site">…</h1>
    <p id="status" class="muted" hidden></p>
    <p id="warning" class="muted" hidden></p>
    <button id="submit" hidden>Filter this site</button>
    <a id="settings" href="#">Model and settings</a>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
