<!doctype html>
<html>
<head><meta charset="utf-8"><title>A shop</title></head>
<body>
<main>
    <article class="card"><span class="label">Sponsored</span><p>A thing for sale</p></article>
    <!-- an icon, as most real pages have: an SVG element is no HTMLElement -->
    <p><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5"></circle></svg> Free shipping</p>
    <article class="card"><p>A real listing</p></article>
    <!-- a card the page itself hides (a layout for another width) -->
    <article class="card" style="display:none"><span class="promo-label">Promoted</span><p>Not shown here</p></article>
    <!-- a component whose label is in its open shadow root -->
    <x-open></x-open>
    <!-- a component whose shadow root is closed: a page's script can't read it -->
    <x-closed></x-closed>
</main>
<script>
    customElements.define("x-open", class extends HTMLElement {
        constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML = '<div class="box"><span class="badge">Featured</span></div>';
        }
    });
    customElements.define("x-closed", class extends HTMLElement {
        constructor() {
            super();
            this.attachShadow({ mode: "closed" }).innerHTML = '<span class="promo">Inside a closed root</span>';
        }
    });
</script>
</body>
</html>
