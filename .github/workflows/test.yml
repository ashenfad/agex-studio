name: Tests

on:
  push:
    branches: [ main ]
  # every pull request, whatever its base (a feature branch's included)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 11.0.4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm typecheck

    - name: Run tests
      run: pnpm vitest run

    # the one check of Vite bundling agex-ts's packages and the world's
    # worker
    - name: Build
      run: pnpm build

  # the browser extensions, loaded into Chromium: the browsing one's port
  # to a page playing the studio, its service worker's idle stop and the
  # heartbeat; the site-filter one's agent and filters
  extension:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 11.0.4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Playwright's Chromium, kept between runs: the lockfile pins Playwright, and with it the
    # browser; its system libraries aren't cached, so they're installed either way
    - name: Cache Chromium
      id: chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Chromium
      if: steps.chromium.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Chromium's system libraries
      if: steps.chromium.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium

    - name: Run the extension's tests
      run: pnpm extension:test

    - name: Run the site-filter extension's tests
      run: pnpm filters:test
