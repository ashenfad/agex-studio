name: Tests

on:
  push:
    branches: [ main, rebuild ]
  pull_request:
    branches: [ main, rebuild ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 11.0.4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm typecheck

    - name: Run tests
      run: pnpm vitest run

    # the one check of Vite bundling agex-ts's packages and the world's
    # worker
    - name: Build
      run: pnpm build
